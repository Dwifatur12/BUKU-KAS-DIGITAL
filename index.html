<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BukuKas Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .bg-navy { background-color: #1e3a8a; }
        .text-navy { color: #1e3a8a; }
        .border-navy { border-color: #1e3a8a; }
        .glass { background: rgba(30, 58, 138, 0.2); backdrop-filter: blur(10px); }
        .locked-overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.7); display: flex; justify-content: center; align-items: center; z-index: 10; border-radius: 0.5rem; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header & Navigation -->
    <div class="max-w-6xl mx-auto flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
        <div>
            <h1 class="text-3xl font-bold text-blue-400">BukuKas<span class="text-white">.</span></h1>
            <p class="text-sm text-slate-400">Sistem Pencatatan Keuangan Digital</p>
        </div>
        <div>
            <button id="btnLogin" onclick="openLoginModal()" class="bg-navy hover:bg-blue-800 text-white px-4 py-2 rounded shadow transition">Login Admin</button>
            <div id="adminMenu" class="hidden flex gap-2">
                <button onclick="openEditAccountModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-2 rounded shadow transition">Edit Akun</button>
                <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded shadow transition">Logout</button>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Form Section -->
        <div class="lg:col-span-1 bg-slate-800 p-6 rounded-lg shadow-lg relative border border-slate-700">
            <div id="lockOverlay" class="locked-overlay">
                <div class="text-center">
                    <svg class="w-12 h-12 text-slate-400 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    <p class="text-sm text-slate-300">Login untuk menambah/edit data</p>
                </div>
            </div>
            
            <h2 class="text-xl font-semibold mb-4 border-b border-slate-600 pb-2" id="formTitle">Catat Transaksi</h2>
            <form id="formTransaksi" class="space-y-4">
                <input type="hidden" id="editId">
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Tanggal</label>
                    <input type="date" id="inputTanggal" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Uraian</label>
                    <textarea id="inputUraian" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-blue-500" required></textarea>
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Pemasukan (Rp)</label>
                    <input type="text" id="inputPemasukan" onkeyup="formatRupiahInput(this)" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-blue-500" placeholder="0">
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Pengeluaran (Rp)</label>
                    <input type="text" id="inputPengeluaran" onkeyup="formatRupiahInput(this)" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-white focus:outline-none focus:border-blue-500" placeholder="0">
                </div>
                <div class="flex gap-2">
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition" id="btnSubmit">Simpan</button>
                    <button type="button" onclick="resetForm()" class="hidden w-1/3 bg-slate-600 hover:bg-slate-700 text-white font-bold py-2 px-4 rounded transition" id="btnCancel">Batal</button>
                </div>
            </form>
        </div>

        <!-- Data & Table Section -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Chart Section -->
            <div class="bg-slate-800 p-4 rounded-lg shadow-lg border border-slate-700 h-64">
                <canvas id="financeChart"></canvas>
            </div>

            <!-- Toolbar (Filter, Search, Export) -->
            <div class="bg-slate-800 p-4 rounded-lg shadow-lg border border-slate-700 flex flex-wrap gap-4 items-center justify-between">
                <div class="flex gap-2 items-center w-full md:w-auto">
                    <input type="text" id="searchData" placeholder="Cari uraian..." class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none" onkeyup="filterData()">
                    <select id="filterWaktu" class="bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none" onchange="filterData()">
                        <option value="semua">Semua Waktu</option>
                        <option value="minggu">Minggu Ini</option>
                        <option value="bulan">Bulan Ini</option>
                        <option value="tahun">Tahun Ini</option>
                    </select>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <button onclick="exportExcel()" class="bg-green-600 hover:bg-green-700 text-white text-sm px-3 py-2 rounded flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> Excel</button>
                    <button onclick="exportWord()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-3 py-2 rounded flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> Word</button>
                    <button onclick="printReport()" class="bg-slate-600 hover:bg-slate-700 text-white text-sm px-3 py-2 rounded flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg> Print</button>
                </div>
            </div>

            <!-- Table -->
            <div class="bg-slate-800 rounded-lg shadow-lg border border-slate-700 overflow-x-auto">
                <table class="w-full text-left border-collapse" id="tabelLaporan">
                    <thead>
                        <tr class="bg-navy text-white text-sm uppercase tracking-wider border-b border-slate-700">
                            <th class="p-3">Tanggal</th>
                            <th class="p-3">Uraian</th>
                            <th class="p-3 text-right">Pemasukan</th>
                            <th class="p-3 text-right">Pengeluaran</th>
                            <th class="p-3 text-right">Total Saldo</th>
                            <th class="p-3 text-center admin-only hidden">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelBody" class="text-sm divide-y divide-slate-700">
                        <!-- Data rows injected by JS -->
                    </tbody>
                    <tfoot class="bg-slate-900 border-t border-slate-600 font-bold">
                        <tr>
                            <td colspan="2" class="p-3 text-right text-slate-300">TOTAL KESELURUHAN:</td>
                            <td class="p-3 text-right text-green-400" id="footPemasukan">Rp 0</td>
                            <td class="p-3 text-right text-red-400" id="footPengeluaran">Rp 0</td>
                            <td class="p-3 text-right text-blue-400" id="footSaldo">Rp 0</td>
                            <td class="p-3 admin-only hidden"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

        </div>
    </div>

    <!-- Modal Login -->
    <div id="modalLogin" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
        <div class="bg-slate-800 p-6 rounded shadow-lg border border-slate-600 w-80">
            <h3 class="text-xl font-bold mb-4 text-white">Login Admin</h3>
            <input type="text" id="usernameLogin" placeholder="Username" class="w-full mb-3 p-2 bg-slate-900 border border-slate-700 rounded text-white focus:outline-none focus:border-blue-500">
            <input type="password" id="passwordLogin" placeholder="Password" class="w-full mb-4 p-2 bg-slate-900 border border-slate-700 rounded text-white focus:outline-none focus:border-blue-500">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('modalLogin')" class="bg-slate-600 hover:bg-slate-500 text-white px-4 py-2 rounded">Batal</button>
                <button onclick="prosesLogin()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Login</button>
            </div>
        </div>
    </div>

    <!-- Modal Edit Akun -->
    <div id="modalEditAkun" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
        <div class="bg-slate-800 p-6 rounded shadow-lg border border-slate-600 w-80">
            <h3 class="text-xl font-bold mb-4 text-white">Edit Kredensial</h3>
            <input type="text" id="newUsername" placeholder="Username Baru" class="w-full mb-3 p-2 bg-slate-900 border border-slate-700 rounded text-white focus:outline-none focus:border-blue-500">
            <input type="password" id="newPassword" placeholder="Password Baru" class="w-full mb-4 p-2 bg-slate-900 border border-slate-700 rounded text-white focus:outline-none focus:border-blue-500">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('modalEditAkun')" class="bg-slate-600 hover:bg-slate-500 text-white px-4 py-2 rounded">Batal</button>
                <button onclick="simpanAkun()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Modal Hapus -->
    <div id="modalHapus" class="hidden fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center z-50">
        <div class="bg-slate-800 p-6 rounded shadow-lg border border-slate-600 w-80 text-center">
            <svg class="w-12 h-12 text-red-500 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            <h3 class="text-lg font-bold mb-2 text-white">Hapus Transaksi?</h3>
            <p class="text-sm text-slate-400 mb-4">Data yang dihapus tidak dapat dikembalikan.</p>
            <input type="hidden" id="deleteId">
            <div class="flex justify-center gap-2">
                <button onclick="closeModal('modalHapus')" class="bg-slate-600 hover:bg-slate-500 text-white px-4 py-2 rounded">Batal</button>
                <button onclick="prosesHapus()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAfQ8aQcctMIY9Q8_j3L2dTchWJf0dCW0E",
            authDomain: "buku-kas-digital-76f4e.firebaseapp.com",
            projectId: "buku-kas-digital-76f4e",
            storageBucket: "buku-kas-digital-76f4e.firebasestorage.app",
            messagingSenderId: "481731129975",
            appId: "1:481731129975:web:c1cc0827a866d5c8f8cc72"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const dbRef = collection(db, "laporan_keuangan");

        let globalData = [];
        let financeChart;
        let isAdmin = false;

        // Inisialisasi Akun Default Lokal
        if(!localStorage.getItem('adminUser')) localStorage.setItem('adminUser', '2001');
        if(!localStorage.getItem('adminPass')) localStorage.setItem('adminPass', 'november');

        // Authentication Logic
        window.openLoginModal = () => document.getElementById('modalLogin').classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');
        window.openEditAccountModal = () => {
            document.getElementById('newUsername').value = localStorage.getItem('adminUser');
            document.getElementById('newPassword').value = localStorage.getItem('adminPass');
            document.getElementById('modalEditAkun').classList.remove('hidden');
        };

        window.prosesLogin = () => {
            const u = document.getElementById('usernameLogin').value;
            const p = document.getElementById('passwordLogin').value;
            if(u === localStorage.getItem('adminUser') && p === localStorage.getItem('adminPass')) {
                isAdmin = true;
                closeModal('modalLogin');
                checkAuthUI();
                document.getElementById('usernameLogin').value = '';
                document.getElementById('passwordLogin').value = '';
            } else {
                alert("Username atau Password salah!");
            }
        };

        window.logout = () => {
            isAdmin = false;
            checkAuthUI();
        };

        window.simpanAkun = () => {
            localStorage.setItem('adminUser', document.getElementById('newUsername').value);
            localStorage.setItem('adminPass', document.getElementById('newPassword').value);
            alert("Kredensial berhasil diperbarui!");
            closeModal('modalEditAkun');
        };

        function checkAuthUI() {
            const elements = document.querySelectorAll('.admin-only');
            if(isAdmin) {
                document.getElementById('lockOverlay').style.display = 'none';
                document.getElementById('btnLogin').classList.add('hidden');
                document.getElementById('adminMenu').classList.remove('hidden');
                elements.forEach(el => el.classList.remove('hidden'));
            } else {
                document.getElementById('lockOverlay').style.display = 'flex';
                document.getElementById('btnLogin').classList.remove('hidden');
                document.getElementById('adminMenu').classList.add('hidden');
                elements.forEach(el => el.classList.add('hidden'));
                resetForm();
            }
        }

        // Format Rupiah
        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        const unformatRupiah = (string) => parseInt(string.replace(/[^0-9]/g, '')) || 0;

        window.formatRupiahInput = (element) => {
            let val = unformatRupiah(element.value);
            if(val === 0) element.value = '';
            else element.value = new Intl.NumberFormat('id-ID').format(val);
        };

        // Firebase Realtime Listener
        onSnapshot(query(dbRef, orderBy("tanggal", "asc")), (snapshot) => {
            let totalSaldo = 0;
            globalData = [];
            snapshot.forEach((doc) => {
                let d = doc.data();
                let pem = Number(d.pemasukan) || 0;
                let peng = Number(d.pengeluaran) || 0;
                totalSaldo = totalSaldo + pem - peng;
                globalData.push({
                    id: doc.id,
                    tanggal: d.tanggal,
                    uraian: d.uraian,
                    pemasukan: pem,
                    pengeluaran: peng,
                    totalSaldo: totalSaldo
                });
            });
            // Reverse agar data terbaru di atas
            globalData.reverse();
            filterData();
        });

        // Form Submit (Add / Edit)
        document.getElementById('formTransaksi').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!isAdmin) return;

            const tgl = document.getElementById('inputTanggal').value;
            const uraian = document.getElementById('inputUraian').value;
            const pem = unformatRupiah(document.getElementById('inputPemasukan').value);
            const peng = unformatRupiah(document.getElementById('inputPengeluaran').value);
            const editId = document.getElementById('editId').value;

            const dataToSave = { tanggal: tgl, uraian: uraian, pemasukan: pem, pengeluaran: peng };

            document.getElementById('btnSubmit').innerHTML = "Menyimpan...";
            document.getElementById('btnSubmit').disabled = true;

            try {
                if(editId) {
                    await updateDoc(doc(db, "laporan_keuangan", editId), dataToSave);
                } else {
                    await addDoc(dbRef, dataToSave);
                }
                resetForm();
            } catch (error) {
                console.error("Error: ", error);
                alert("Gagal menyimpan data.");
            } finally {
                document.getElementById('btnSubmit').innerHTML = "Simpan";
                document.getElementById('btnSubmit').disabled = false;
            }
        });

        // Edit Data
        window.editData = (id) => {
            if(!isAdmin) return;
            const data = globalData.find(d => d.id === id);
            if(data) {
                document.getElementById('editId').value = data.id;
                document.getElementById('inputTanggal').value = data.tanggal;
                document.getElementById('inputUraian').value = data.uraian;
                document.getElementById('inputPemasukan').value = data.pemasukan === 0 ? '' : new Intl.NumberFormat('id-ID').format(data.pemasukan);
                document.getElementById('inputPengeluaran').value = data.pengeluaran === 0 ? '' : new Intl.NumberFormat('id-ID').format(data.pengeluaran);
                
                document.getElementById('formTitle').innerText = "Update Transaksi";
                document.getElementById('btnSubmit').innerText = "Update";
                document.getElementById('btnSubmit').classList.replace('bg-blue-600', 'bg-green-600');
                document.getElementById('btnCancel').classList.remove('hidden');
            }
        };

        // Hapus Data
        window.konfirmasiHapus = (id) => {
            if(!isAdmin) return;
            document.getElementById('deleteId').value = id;
            document.getElementById('modalHapus').classList.remove('hidden');
        };

        window.prosesHapus = async () => {
            const id = document.getElementById('deleteId').value;
            closeModal('modalHapus');
            try {
                await deleteDoc(doc(db, "laporan_keuangan", id));
            } catch (error) {
                console.error("Error hapus: ", error);
            }
        };

        window.resetForm = () => {
            document.getElementById('formTransaksi').reset();
            document.getElementById('editId').value = '';
            document.getElementById('formTitle').innerText = "Catat Transaksi";
            document.getElementById('btnSubmit').innerText = "Simpan";
            document.getElementById('btnSubmit').classList.replace('bg-green-600', 'bg-blue-600');
            document.getElementById('btnCancel').classList.add('hidden');
        };

        // Filter, Search, Render & Chart
        window.filterData = () => {
            const search = document.getElementById('searchData').value.toLowerCase();
            const filter = document.getElementById('filterWaktu').value;
            const now = new Date();
            
            let filtered = globalData.filter(item => {
                const itemDate = new Date(item.tanggal);
                let matchSearch = item.uraian.toLowerCase().includes(search);
                let matchDate = true;

                if(filter === 'minggu') {
                    const diffTime = Math.abs(now - itemDate);
                    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                    matchDate = diffDays <= 7;
                } else if(filter === 'bulan') {
                    matchDate = itemDate.getMonth() === now.getMonth() && itemDate.getFullYear() === now.getFullYear();
                } else if(filter === 'tahun') {
                    matchDate = itemDate.getFullYear() === now.getFullYear();
                }
                return matchSearch && matchDate;
            });

            renderTable(filtered);
            updateChart(filtered);
        };

        function renderTable(data) {
            const tbody = document.getElementById('tabelBody');
            tbody.innerHTML = '';
            let tPem = 0, tPeng = 0;

            data.forEach(d => {
                tPem += d.pemasukan;
                tPeng += d.pengeluaran;
                
                let row = `<tr>
                    <td class="p-3 whitespace-nowrap">${d.tanggal}</td>
                    <td class="p-3">${d.uraian}</td>
                    <td class="p-3 text-right text-green-400">${formatRupiah(d.pemasukan)}</td>
                    <td class="p-3 text-right text-red-400">${formatRupiah(d.pengeluaran)}</td>
                    <td class="p-3 text-right font-bold text-blue-400">${formatRupiah(d.totalSaldo)}</td>
                    <td class="p-3 text-center admin-only ${isAdmin ? '' : 'hidden'}">
                        <button onclick="editData('${d.id}')" class="text-blue-400 hover:text-blue-300 mr-2"><svg class="w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                        <button onclick="konfirmasiHapus('${d.id}')" class="text-red-500 hover:text-red-400"><svg class="w-5 h-5 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });

            document.getElementById('footPemasukan').innerText = formatRupiah(tPem);
            document.getElementById('footPengeluaran').innerText = formatRupiah(tPeng);
            document.getElementById('footSaldo').innerText = formatRupiah(tPem - tPeng);
        }

        function updateChart(data) {
            let tPem = 0, tPeng = 0;
            data.forEach(d => { tPem += d.pemasukan; tPeng += d.pengeluaran; });

            const ctx = document.getElementById('financeChart').getContext('2d');
            if(financeChart) financeChart.destroy();
            
            Chart.defaults.color = '#cbd5e1';
            financeChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Ringkasan Keuangan'],
                    datasets: [
                        { label: 'Pemasukan', data: [tPem], backgroundColor: 'rgba(74, 222, 128, 0.8)', borderRadius: 4 },
                        { label: 'Pengeluaran', data: [tPeng], backgroundColor: 'rgba(248, 113, 113, 0.8)', borderRadius: 4 }
                    ]
                },
                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: '#334155' } }, x: { grid: { display: false } } }, plugins: { legend: { position: 'top' } } }
            });
        }

        // Ekspor Excel (dengan xlsx-js-style)
        window.exportExcel = () => {
            const displayedRows = Array.from(document.getElementById('tabelBody').querySelectorAll('tr'));
            const exportData = displayedRows.map(row => {
                const cols = row.querySelectorAll('td');
                if(cols.length < 5) return null;
                return {
                    "Tanggal": cols[0].innerText,
                    "Uraian": cols[1].innerText,
                    "Pemasukan": unformatRupiah(cols[2].innerText),
                    "Pengeluaran": unformatRupiah(cols[3].innerText),
                    "Total Saldo": unformatRupiah(cols[4].innerText)
                };
            }).filter(item => item !== null);

            if(exportData.length === 0) return alert('Tidak ada data untuk diekspor');

            const ws = XLSX.utils.json_to_sheet(exportData);
            const borderStyle = { top: { style: "thin", color: { rgb: "000000" } }, bottom: { style: "thin", color: { rgb: "000000" } }, left: { style: "thin", color: { rgb: "000000" } }, right: { style: "thin", color: { rgb: "000000" } } };
            const range = XLSX.utils.decode_range(ws['!ref']);

            for (let R = range.s.r; R <= range.e.r; ++R) {
                for (let C = range.s.c; C <= range.e.c; ++C) {
                    const cellRef = XLSX.utils.encode_cell({ c: C, r: R });
                    if (!ws[cellRef]) continue;
                    if (!ws[cellRef].s) ws[cellRef].s = {};
                    ws[cellRef].s.border = borderStyle;
                    if (R === 0) {
                        ws[cellRef].s.fill = { fgColor: { rgb: "000080" } };
                        ws[cellRef].s.font = { color: { rgb: "FFFFFF" }, bold: true };
                        ws[cellRef].s.alignment = { horizontal: "center", vertical: "center" };
                    } else {
                        ws[cellRef].s.alignment = { vertical: "center" };
                        if (C >= 2 && C <= 4) ws[cellRef].z = '"Rp"#,##0;"Rp"-#,##0;"Rp"0';
                    }
                }
            }
            ws['!cols'] = [{ wch: 15 }, { wch: 35 }, { wch: 20 }, { wch: 20 }, { wch: 20 }];
            
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Laporan Keuangan");
            XLSX.writeFile(wb, "Laporan_BukuKas.xlsx");
        };

        // Ekspor Word HTML
        window.exportWord = () => {
            const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Export HTML to Word</title></head><body>";
            const footer = "</body></html>";
            
            let htmlTable = "<h2 style='text-align:center; font-family:sans-serif;'>Laporan Keuangan BukuKas</h2>";
            htmlTable += "<table border='1' style='border-collapse:collapse; width:100%; font-family:sans-serif;'>";
            
            const tableElement = document.getElementById('tabelLaporan');
            const rows = tableElement.querySelectorAll('tr');
            
            rows.forEach((row, index) => {
                let isHeader = index === 0;
                let bg = isHeader ? "background-color:#1e3a8a; color:white;" : "";
                htmlTable += `<tr style="${bg}">`;
                
                const cells = row.querySelectorAll('th, td');
                cells.forEach((cell, cellIndex) => {
                    if(cellIndex < 5) {
                        let align = (cellIndex > 1) ? "text-align:right;" : "text-align:left;";
                        let tag = isHeader ? "th" : "td";
                        htmlTable += `<${tag} style="padding:8px; border:1px solid #000; ${align}">${cell.innerText}</${tag}>`;
                    }
                });
                htmlTable += "</tr>";
            });
            htmlTable += "</table>";

            const blob = new Blob(['\ufeff', header + htmlTable + footer], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('A');
            link.href = url;
            link.download = 'Laporan_BukuKas.doc';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        // Print Report
        window.printReport = () => {
            let printContents = "<h2 style='text-align:center; font-family:sans-serif; margin-bottom:20px;'>Laporan Keuangan BukuKas</h2>";
            printContents += "<table border='1' style='border-collapse:collapse; width:100%; font-family:sans-serif; font-size: 14px;'>";
            
            const tableElement = document.getElementById('tabelLaporan');
            const rows = tableElement.querySelectorAll('tr');
            
            rows.forEach((row, index) => {
                let isHeader = index === 0;
                let bg = isHeader ? "background-color:#f0f0f0; font-weight:bold;" : "";
                printContents += `<tr style="${bg}">`;
                
                const cells = row.querySelectorAll('th, td');
                cells.forEach((cell, cellIndex) => {
                    if(cellIndex < 5) {
                        let align = (cellIndex > 1) ? "text-align:right;" : "text-align:left;";
                        let tag = isHeader ? "th" : "td";
                        printContents += `<${tag} style="padding:8px; border:1px solid #000; ${align}">${cell.innerText}</${tag}>`;
                    }
                });
                printContents += "</tr>";
            });
            printContents += "</table>";

            const originalContents = document.body.innerHTML;
            document.body.innerHTML = printContents;
            window.print();
            document.body.innerHTML = originalContents;
            location.reload(); 
        };

        // Inisialisasi awal UI Auth
        checkAuthUI();

    </script>
</body>
</html>
